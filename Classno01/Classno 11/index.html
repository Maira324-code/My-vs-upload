<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>

    <!-- First Name -->
     <label>First Name:</label>
     <input type="text" name="first-name"><br><br>

     <!-- Last Name -->
      <label>Last Name:</label>
      <input type="text" name="last name"><br><br>

      <!-- Adress -->
       <label>Adress:</label>
       <input type="text" name="adress"><br><br>

       <!-- Phone No -->
        <label>Phone No:</label>
        <input type="text" name="Phone No"><br><br>

        <!-- Reg # -->
         <label>Reg No:</label>
         <input type="text" name="Reg no"><br><br>

         <!-- City -->
          <label>City:</label>
          <input type="text" name="city"><br></br>

          <!-- Religion -->
           <label>Religion:</label><br><br>
        <input type="checkbox" name="religion" value="Muslim"> Muslim
           <input type="checkbox" name="religion"  value="Non-Muslim"> Non-Muslim<br></br>

           <!-- Gender -->
            <label>Gender:</label>
           <input type="radio" name="gender" value="Male">Male
           <input type="radio" name="gender" value="Female"> female<br><br>

           <!-- Submit -->
            <input type="submit" value="Submit">
</form>

    
</body>
</html>
